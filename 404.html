<!doctype html>
<html lang="en-IE">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Lost in the woods? | TreeMAP Ireland</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f7f4;
        color: #1f2a24;
      }

      main {
        box-sizing: border-box;
        width: min(92vw, 560px);
        padding: 32px;
        border: 1px solid #d9e2d8;
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 18px 60px rgba(19, 35, 25, 0.12);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(1.6rem, 4vw, 2.1rem);
        line-height: 1.15;
      }

      p {
        margin: 0 0 14px;
        line-height: 1.55;
      }

      a.button {
        display: inline-block;
        margin-top: 6px;
        padding: 10px 18px;
        border-radius: 6px;
        background: #2e7d32;
        color: #fff;
        font-weight: 650;
        text-decoration: none;
      }

      a.button:hover,
      a.button:focus-visible {
        background: #256b29;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Lost in the woods?</h1>
      <p>
        We have mapped every one of Ireland's more than 100 million trees, but
        we can't find this page.
      </p>
      <p><a class="button" href="/">Find your way back to the map</a></p>
    </main>
  </body>
</html>
