<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Signing in...</title>
</head>
<body>
  <!--
    ArcGIS OAuth popup callback (team sign-in, see src/app.js). ArcGIS redirects
    the sign-in popup here; this hands the result back to the map page, where
    the ArcGIS Maps SDK listens for these events, then closes the popup.
    Must stay registered as a redirect URL on the OAuth credential.
  -->
  <script>
    if (window.opener) {
      if (location.hash) {
        window.opener.dispatchEvent(new CustomEvent("arcgis:auth:hash", { detail: location.hash }));
      } else if (location.search) {
        window.opener.dispatchEvent(new CustomEvent("arcgis:auth:location:search", { detail: location.search }));
      }
    }
    window.close();
  </script>
</body>
</html>
